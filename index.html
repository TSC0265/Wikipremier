<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 위키백과 프리미엄 뷰어</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 눈누 웹 폰트: 웹페이지 UI용 */
        @font-face {
            font-family: 'LINESeedKR-Rg';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'LINESeedKR-Bd';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
            font-weight: 700;
        }
        @font-face {
            font-family: 'NanumSquareNeo-Variable';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2') format('woff2');
            font-weight: normal;
        }

        /* 🌙 다크 모드 및 테마 변수 설정 */
        :root {
            --bg-color: #f4f7f9;
            --text-main: #2c3e50;
            --text-sub: #64748b;
            --card-bg: white;
            --border-color: #edf2f7;
            --border-hover: #cbd5e1;
            --primary: #2980b9;
            --primary-hover: #1c5985;
            --namu-color: #00a495;
            --namu-hover: #00877a;
            --btn-bg: #f1f5f9;
            --btn-text: #475569;
            
            /* 위키 본문용 */
            --wiki-text: #334155;
            --wiki-heading: #1e293b;
            --wiki-link: #0284c7;
            --wiki-link-hover: #0369a1;
            --wiki-infobox: #f8fafc;
            --wiki-infobox-header: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --card-bg: #1e1e1e;
            --border-color: #334155;
            --border-hover: #475569;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --namu-color: #00c4b2;
            --namu-hover: #00e0cb;
            --btn-bg: #334155;
            --btn-text: #f8fafc;

            /* 위키 본문용 */
            --wiki-text: #cbd5e1;
            --wiki-heading: #f8fafc;
            --wiki-link: #38bdf8;
            --wiki-link-hover: #7dd3fc;
            --wiki-infobox: #1e293b;
            --wiki-infobox-header: #334155;
        }

        /* 기본 스타일 */
        body {
            font-family: 'LINESeedKR-Rg', 'NanumSquareNeo-Variable', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* 다크모드 토글 버튼 */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: var(--text-main);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header img {
            width: 140px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .header h1 {
            font-family: 'LINESeedKR-Bd', sans-serif;
            margin: 0;
            font-size: 28px;
            color: var(--text-main);
        }

        /* 검색 영역 */
        .search-wrapper {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .search-container {
            display: flex;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-radius: 30px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        #searchInput {
            flex-grow: 1;
            padding: 18px 25px;
            font-size: 16px;
            font-family: 'LINESeedKR-Rg', sans-serif;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
        }
        #searchBtn {
            padding: 0 30px;
            font-size: 16px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #searchBtn:hover {
            background-color: var(--primary-hover);
        }

        /* 최근 검색어 영역 */
        .recent-searches {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .recent-tag {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .recent-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 로딩 스피너 애니메이션 */
        .loading-container {
            display: none;
            text-align: center;
            margin: 40px 0;
        }
        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--text-sub); font-size: 16px; }

        /* 전체 레이아웃 */
        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1400px;
            gap: 30px;
        }

        /* 왼쪽: 검색 결과 리스트 */
        #results {
            flex: 1;
            min-width: 320px;
            max-width: 380px;
        }
        .result-item {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .result-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-color: var(--border-hover);
        }
        .result-title {
            margin: 0 0 12px 0;
            font-size: 19px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: var(--primary);
        }
        .result-snippet {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .searchmatch {
            font-weight: bold;
            color: #e74c3c;
            background-color: rgba(231, 76, 60, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }
        .view-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .view-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        /* 오른쪽: 본문 읽기 뷰어 상단 타이틀 영역 */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            gap: 15px;
        }
        .content-header h1 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 32px;
            margin: 0;
            color: var(--wiki-heading);
        }
        
        /* 🌳 나무위키 이동 버튼 스타일 */
        .namu-btn {
            background-color: var(--namu-color);
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 164, 149, 0.15);
            transition: all 0.2s;
        }
        .namu-btn:hover {
            background-color: var(--namu-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 164, 149, 0.25);
            color: white;
        }

        /* 오른쪽: 본문 읽기 뷰어 */
        #content-view {
            flex: 3;
            background-color: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: none; 
            overflow-x: hidden;
            border: 1px solid var(--border-color);
        }
        
        .wiki-body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            font-size: 16px;
            line-height: 1.8;
            color: var(--wiki-text);
            font-weight: 400;
        }

        .wiki-body img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }

        .wiki-body a {
            text-decoration: none;
            color: var(--wiki-link);
            font-weight: 500;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
            border-bottom: 1.5px solid transparent;
        }
        .wiki-body a:hover {
            color: var(--wiki-link-hover);
            border-bottom: 1.5px solid var(--wiki-link-hover);
            background-color: rgba(2, 132, 199, 0.1);
        }

        .wiki-body .infobox {
            float: right;
            clear: right;
            margin: 0 0 20px 20px;
            background-color: var(--wiki-infobox);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            width: 320px;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
        }
        .wiki-body .infobox th {
            background-color: var(--wiki-infobox-header);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            color: var(--wiki-heading);
        }
        .wiki-body .infobox td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .wiki-body .thumb {
            float: right;
            clear: right;
            margin: 0 0 20px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
        }
        .wiki-body .thumbinner { border: none !important; background: transparent !important; width: auto !important; }
        .wiki-body .thumbcaption { font-size: 13px; color: var(--text-sub); padding-top: 8px; text-align: left; }

        .wiki-body .toc {
            background: var(--wiki-infobox);
            border: 1px solid var(--border-color);
            padding: 25px;
            display: inline-block;
            margin: 20px 0;
            border-radius: 16px;
        }
        .wiki-body .toc h2 { margin-top: 0; border: none; font-size: 18px; font-weight: 700; }
        .wiki-body .toc ul { list-style-type: none; padding-left: 20px; }

        .wiki-body h2 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: var(--wiki-heading);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 2em;
            margin-bottom: 1em;
            scroll-margin-top: 20px; 
        }
        .wiki-body h3 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--wiki-heading);
            margin-top: 1.5em;
            scroll-margin-top: 20px;
        }
        
        .wiki-body .mw-editsection,
        .wiki-body .reference,
        .wiki-body .navbox,
        .wiki-body .metadata { display: none; }
        
        .wiki-body blockquote {
            background: var(--wiki-infobox);
            border-left: 5px solid var(--primary);
            margin: 1.5em 0;
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            color: var(--text-sub);
            font-style: italic;
        }

        /* 위로 가기 버튼 */
        #scrollTopBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            border: none;
            outline: none;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            padding: 15px;
            border-radius: 50%;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.2s;
        }
        #scrollTopBtn:hover { background-color: var(--primary-hover); transform: translateY(-3px); }

        /* 모바일 반응형 웹 지원 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            #results { max-width: 100%; min-width: auto; }
            #content-view { padding: 25px; }
            .content-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .namu-btn { width: 100%; justify-content: center; }
            .wiki-body .infobox, .wiki-body .thumb { float: none; width: 100%; margin: 0 0 20px 0; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">🌙 다크 모드</button>

    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/220px-Wikipedia-logo-v2.svg.png" alt="위키백과 로고">
        <h1>미니 백과사전</h1>
    </div>

    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="궁금한 지식을 검색해 보세요..." onkeypress="handleKeyPress(event)">
            <button id="searchBtn" onclick="searchWikipedia()">검색</button>
        </div>
    </div>

    <div id="recent-searches" class="recent-searches"></div>

    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">지식을 탐색하는 중입니다...</div>
    </div>

    <div class="main-layout">
        <div id="results"></div>
        <div id="content-view"></div>
    </div>

    <button id="scrollTopBtn" onclick="scrollToTop()" title="위로 가기">↑</button>

    <script>
        const articleCache = {}; 
        let recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || [];

        // 🌙 다크모드 초기화 및 토글 로직
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').textContent = '☀️ 라이트 모드';
            }
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggleBtn').textContent = newTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        }

        // 💾 최근 검색어 UI 업데이트 및 추가 로직
        function updateRecentSearchesUI() {
            const container = document.getElementById('recent-searches');
            container.innerHTML = '';
            recentSearches.forEach(keyword => {
                const tag = document.createElement('div');
                tag.className = 'recent-tag';
                tag.textContent = keyword;
                tag.onclick = () => {
                    document.getElementById('searchInput').value = keyword;
                    searchWikipedia();
                };
                container.appendChild(tag);
            });
        }
        function addRecentSearch(query) {
            recentSearches = recentSearches.filter(item => item !== query); // 중복 제거
            recentSearches.unshift(query); // 맨 앞에 추가
            if (recentSearches.length > 5) recentSearches.pop(); // 최대 5개 유지
            localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            updateRecentSearchesUI();
        }

        // ⬆️ 위로 가기 스크롤 이벤트
        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 🔙 브라우저 뒤로 가기 (History API) 이벤트 리스너
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.title) {
                fetchArticleContent(event.state.title, false); 
            } else {
                document.getElementById('content-view').style.display = 'none';
            }
        });

        // 엔터키 검색
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWikipedia();
            }
        }

        async function searchWikipedia() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');

            if (!query) {
                alert('검색어를 입력해주세요!');
                return;
            }

            addRecentSearch(query);

            resultsContainer.innerHTML = '';
            contentView.style.display = 'none';
            loadingIndicator.style.display = 'block';

            const url = `https://ko.wikipedia.org/w/api.php?action=query&list=search&utf8=&format=json&origin=*&srlimit=8&srsearch=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                const searchResults = data.query.search;

                loadingIndicator.style.display = 'none';

                if (searchResults.length === 0) {
                    resultsContainer.innerHTML = '<div class="result-item"><p>검색 결과가 없습니다.</p></div>';
                    return;
                }

                searchResults.forEach(result => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    
                    resultItem.innerHTML = `
                        <h2 class="result-title">${result.title}</h2>
                        <div class="result-snippet">${result.snippet}...</div>
                        <button class="view-btn" onclick="fetchArticleContent('${result.title.replace(/'/g, "\\'")}')">본문 읽기</button>
                    `;
                    resultsContainer.appendChild(resultItem);
                });

            } catch (error) {
                loadingIndicator.style.display = 'none';
                console.error(error);
            }
        }

        async function fetchArticleContent(title, pushHistory = true) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');

            loadingIndicator.style.display = 'block';
            contentView.style.display = 'none';

            // 🔙 History API URL 업데이트 (로컬 file:// 환경 오류 방지 처리)
            if (pushHistory) {
                try {
                    history.pushState({ title: title }, title, `?article=${encodeURIComponent(title)}`);
                } catch (error) {
                    console.warn("로컬 환경(file://)에서는 History API가 제한되지만, 본문은 정상적으로 로드됩니다.");
                }
            }

            if (articleCache[title]) {
                renderContent(title, articleCache[title]);
                return;
            }

            const url = `https://ko.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=text&format=json&origin=*`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    loadingIndicator.style.display = 'none';
                    alert('본문을 불러오는 데 실패했습니다.');
                    return;
                }

                const articleHtml = data.parse.text['*'];
                const parser = new DOMParser();
                const doc = parser.parseFromString(articleHtml, 'text/html');

                // 이미지 처리
                const images = doc.querySelectorAll('img');
                images.forEach(img => {
                    img.setAttribute('loading', 'lazy');
                    const src = img.getAttribute('src');
                    const srcset = img.getAttribute('srcset');
                    
                    if (src && src.startsWith('//')) {
                        img.setAttribute('src', 'https:' + src);
                    } else if (src && src.startsWith('/')) {
                        img.setAttribute('src', 'https://ko.wikipedia.org' + src);
                    }
                    
                    if (srcset) {
                        const newSrcset = srcset.split(',').map(item => {
                            let parts = item.trim().split(' ');
                            if (parts[0].startsWith('//')) {
                                parts[0] = 'https:' + parts[0];
                            } else if (parts[0].startsWith('/')) {
                                parts[0] = 'https://ko.wikipedia.org' + parts[0];
                            }
                            return parts.join(' ');
                        }).join(', ');
                        img.setAttribute('srcset', newSrcset);
                    }
                });

                // 링크 처리
                const links = doc.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('/wiki/')) {
                        if (!href.startsWith('/wiki/파일:') && !href.startsWith('/wiki/File:')) {
                            const newTitle = decodeURIComponent(href.replace('/wiki/', ''));
                            link.setAttribute('href', 'javascript:void(0);');
                            link.setAttribute('onclick', `fetchArticleContent('${newTitle.replace(/'/g, "\\'")}')`);
                        } else {
                            link.setAttribute('href', 'https://ko.wikipedia.org' + href);
                            link.setAttribute('target', '_blank');
                        }
                    } else if (href && href.startsWith('#')) {
                        const anchorId = href.substring(1); 
                        link.setAttribute('href', 'javascript:void(0);');
                        link.setAttribute('data-anchor', anchorId);
                        link.setAttribute('onclick', `scrollToSection(this.getAttribute('data-anchor'))`);
                    }
                });

                const processedHtml = doc.body.innerHTML;
                articleCache[title] = processedHtml;

                renderContent(title, processedHtml);

            } catch (error) {
                loadingIndicator.style.display = 'none';
                alert('오류가 발생했습니다.');
                console.error(error);
            }
        }

        function renderContent(title, html) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');
            
            // 🌳 나무위키 이동 링크 생성 (새 탭에서 열기)
            const namuUrl = `https://namu.wiki/w/${encodeURIComponent(title)}`;
            
            contentView.innerHTML = `
                <div class="content-header">
                    <h1>${title}</h1>
                    <a href="${namuUrl}" target="_blank" class="namu-btn">🌳 나무위키에서 찾기</a>
                </div>
                <div class="wiki-body">${html}</div>
            `;
            
            loadingIndicator.style.display = 'none';
            contentView.style.display = 'block';
            contentView.scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToSection(anchorId) {
            try {
                const decodedId = decodeURIComponent(anchorId);
                const targetElement = document.getElementById(decodedId) || document.getElementById(anchorId);
                
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            } catch (error) {
                console.error("목차 이동 중 오류가 발생했습니다:", error);
            }
        }

        // 초기화 실행
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateRecentSearchesUI();

            // URL 파라미터 확인 (공유된 링크나 새로고침 대응)
            const urlParams = new URLSearchParams(window.location.search);
            const articleParam = urlParams.get('article');
            if (articleParam) {
                fetchArticleContent(articleParam, false);
            }
        });
    </script>
</body>
</html>
