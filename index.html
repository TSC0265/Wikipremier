<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위키백과 뷰어 Premier</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* [중략: 기존 스타일 동일] */
        @font-face {
            font-family: 'LINESeedKR-Rg';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'LINESeedKR-Bd';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
            font-weight: 700;
        }
        @font-face {
            font-family: 'NanumSquareNeo-Variable';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2') format('woff2');
            font-weight: normal;
        }

        :root {
            --bg-color: #f4f7f9;
            --text-main: #2c3e50;
            --text-sub: #64748b;
            --card-bg: white;
            --border-color: #edf2f7;
            --border-hover: #cbd5e1;
            --primary: #2980b9;
            --primary-hover: #1c5985;
            --namu-color: #00a495;
            --namu-hover: #00877a;
            --btn-bg: #f1f5f9;
            --btn-text: #475569;
            --wiki-text: #334155;
            --wiki-heading: #1e293b;
            --wiki-link: #0284c7;
            --wiki-link-hover: #0369a1;
            --wiki-infobox: #f8fafc;
            --wiki-infobox-header: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --card-bg: #1e1e1e;
            --border-color: #334155;
            --border-hover: #475569;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --namu-color: #00c4b2;
            --namu-hover: #00e0cb;
            --btn-bg: #334155;
            --btn-text: #f8fafc;
            --wiki-text: #cbd5e1;
            --wiki-heading: #f8fafc;
            --wiki-link: #38bdf8;
            --wiki-link-hover: #7dd3fc;
            --wiki-infobox: #1e293b;
            --wiki-infobox-header: #334155;
        }

        body {
            font-family: 'LINESeedKR-Rg', 'NanumSquareNeo-Variable', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: var(--text-main);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header img {
            width: 140px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        
        /* 💡 수정된 부분: 헤더 타이틀 클릭 가능하도록 설정 */
        .header h1 {
            font-family: 'LINESeedKR-Bd', sans-serif;
            margin: 0;
            font-size: 28px;
            color: var(--text-main);
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-block;
        }
        .header h1:hover {
            opacity: 0.7;
        }

        /* [나머지 CSS 생략: 이전 코드와 동일하게 유지] */
        .search-wrapper { width: 100%; max-width: 650px; margin-bottom: 20px; }
        .search-container { display: flex; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border-radius: 30px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-color); }
        #searchInput { flex-grow: 1; padding: 18px 25px; font-size: 16px; border: none; outline: none; background: transparent; color: var(--text-main); }
        #searchBtn { padding: 0 30px; font-size: 16px; font-family: 'LINESeedKR-Bd', sans-serif; background-color: var(--primary); color: white; border: none; cursor: pointer; }
        .recent-searches { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .recent-tag { background-color: var(--card-bg); color: var(--text-sub); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .loading-container { display: none; text-align: center; margin: 40px 0; }
        .spinner { border: 4px solid var(--border-color); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .main-layout { display: flex; width: 100%; max-width: 1400px; gap: 30px; }
        #results { flex: 1; min-width: 320px; max-width: 380px; }
        .result-item { background-color: var(--card-bg); padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .result-title { margin: 0 0 12px 0; font-size: 19px; color: var(--primary); }
        .view-btn { background-color: var(--btn-bg); color: var(--btn-text); border: none; padding: 10px 18px; font-size: 14px; border-radius: 8px; cursor: pointer; width: 100%; }
        .content-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        .namu-btn { background-color: var(--namu-color); color: white; border: none; padding: 10px 16px; font-size: 14px; border-radius: 30px; cursor: pointer; text-decoration: none; }
        #content-view { flex: 3; background-color: var(--card-bg); padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: none; border: 1px solid var(--border-color); }
        .wiki-body { font-size: 16px; line-height: 1.8; color: var(--wiki-text); }
        .wiki-body img { max-width: 100%; height: auto; border-radius: 8px; }
        #scrollTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; border: none; background-color: var(--primary); color: white; cursor: pointer; padding: 15px; border-radius: 50%; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            #results { max-width: 100%; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">🌙 다크 모드</button>

    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/220px-Wikipedia-logo-v2.svg.png" alt="위키백과 로고">
        <!-- 💡 수정된 부분: onclick 추가 -->
        <h1 onclick="goHome()">위키백과 뷰어 Premier</h1>
    </div>

    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="궁금한 지식을 검색해 보세요..." onkeypress="handleKeyPress(event)">
            <button id="searchBtn" onclick="searchWikipedia()">검색</button>
        </div>
    </div>

    <div id="recent-searches" class="recent-searches"></div>
    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">지식을 탐색하는 중입니다...</div>
    </div>

    <div class="main-layout">
        <div id="results"></div>
        <div id="content-view"></div>
    </div>

    <button id="scrollTopBtn" onclick="scrollToTop()" title="위로 가기">↑</button>

    <script>
        // 💡 새롭게 추가된 함수
        function goHome() {
            document.getElementById('content-view').style.display = 'none';
            // URL 파라미터 초기화
            history.pushState(null, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // [중략: 기존 JS 로직 유지, 아래 함수만 확인]
        const articleCache = {}; 
        let recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || [];

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').textContent = '☀️ 라이트 모드';
            }
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggleBtn').textContent = newTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        }

        function updateRecentSearchesUI() {
            const container = document.getElementById('recent-searches');
            container.innerHTML = '';
            recentSearches.forEach(keyword => {
                const tag = document.createElement('div');
                tag.className = 'recent-tag';
                tag.textContent = keyword;
                tag.onclick = () => { document.getElementById('searchInput').value = keyword; searchWikipedia(); };
                container.appendChild(tag);
            });
        }
        function addRecentSearch(query) {
            recentSearches = recentSearches.filter(item => item !== query);
            recentSearches.unshift(query);
            if (recentSearches.length > 5) recentSearches.pop();
            localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            updateRecentSearchesUI();
        }

        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) btn.style.display = "block";
            else btn.style.display = "none";
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.title) { fetchArticleContent(event.state.title, false); }
            else { document.getElementById('content-view').style.display = 'none'; }
        });

        function handleKeyPress(event) { if (event.key === 'Enter') searchWikipedia(); }

        async function searchWikipedia() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');

            if (!query) { alert('검색어를 입력해주세요!'); return; }
            addRecentSearch(query);
            resultsContainer.innerHTML = '';
            contentView.style.display = 'none';
            loadingIndicator.style.display = 'block';

            const url = `https://ko.wikipedia.org/w/api.php?action=query&list=search&utf8=&format=json&origin=*&srlimit=8&srsearch=${encodeURIComponent(query)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const searchResults = data.query.search;
                loadingIndicator.style.display = 'none';
                if (searchResults.length === 0) { resultsContainer.innerHTML = '<div class="result-item"><p>검색 결과가 없습니다.</p></div>'; return; }
                searchResults.forEach(result => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `<h2 class="result-title">${result.title}</h2><div class="result-snippet">${result.snippet}...</div><button class="view-btn" onclick="fetchArticleContent('${result.title.replace(/'/g, "\\'")}')">본문 읽기</button>`;
                    resultsContainer.appendChild(resultItem);
                });
            } catch (error) { loadingIndicator.style.display = 'none'; console.error(error); }
        }

        async function fetchArticleContent(title, pushHistory = true) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.style.display = 'block';
            contentView.style.display = 'none';

            if (pushHistory) {
                try { history.pushState({ title: title }, title, `?article=${encodeURIComponent(title)}`); } catch (error) {}
            }

            if (articleCache[title]) { renderContent(title, articleCache[title]); return; }

            const url = `https://ko.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=text&format=json&origin=*`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const articleHtml = data.parse.text['*'];
                const parser = new DOMParser();
                const doc = parser.parseFromString(articleHtml, 'text/html');
                
                // [이미지/링크 처리 생략: 이전 코드와 동일]
                const images = doc.querySelectorAll('img');
                images.forEach(img => {
                    img.setAttribute('loading', 'lazy');
                    const src = img.getAttribute('src');
                    if (src && src.startsWith('//')) img.setAttribute('src', 'https:' + src);
                    else if (src && src.startsWith('/')) img.setAttribute('src', 'https://ko.wikipedia.org' + src);
                });
                const links = doc.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('/wiki/')) {
                        if (!href.startsWith('/wiki/파일:') && !href.startsWith('/wiki/File:')) {
                            const newTitle = decodeURIComponent(href.replace('/wiki/', ''));
                            link.setAttribute('href', 'javascript:void(0);');
                            link.setAttribute('onclick', `fetchArticleContent('${newTitle.replace(/'/g, "\\'")}')`);
                        } else { link.setAttribute('href', 'https://ko.wikipedia.org' + href); link.setAttribute('target', '_blank'); }
                    }
                });

                const processedHtml = doc.body.innerHTML;
                articleCache[title] = processedHtml;
                renderContent(title, processedHtml);
            } catch (error) { loadingIndicator.style.display = 'none'; alert('오류가 발생했습니다.'); }
        }

        function renderContent(title, html) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');
            const namuUrl = `https://namu.wiki/w/${encodeURIComponent(title)}`;
            contentView.innerHTML = `
                <div class="content-header">
                    <h1>${title}</h1>
                    <a href="${namuUrl}" target="_blank" class="namu-btn">🌳 나무위키에서 찾기</a>
                </div>
                <div class="wiki-body">${html}</div>
            `;
            loadingIndicator.style.display = 'none';
            contentView.style.display = 'block';
            contentView.scrollIntoView({ behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateRecentSearchesUI();
            const urlParams = new URLSearchParams(window.location.search);
            const articleParam = urlParams.get('article');
            if (articleParam) fetchArticleContent(articleParam, false);
        });
    </script>
</body>
</html>
