<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위키백과 뷰어 Premier</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 눈누 웹 폰트: 웹페이지 UI용 */
        @font-face {
            font-family: 'LINESeedKR-Rg';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'LINESeedKR-Bd';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
            font-weight: 700;
        }
        @font-face {
            font-family: 'NanumSquareNeo-Variable';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2') format('woff2');
            font-weight: normal;
        }

        /* 🌙 다크 모드 및 테마 변수 설정 */
        :root {
            /* 🌸 라이트 모드: 화사하고 포근한 파스텔 메인 셋팅 */
            --bg-gradient: linear-gradient(135deg, #fef3c7 0%, #e0f2fe 50%, #fbcfe8 100%);
            --text-main: #1e293b;
            --text-sub: #475569;
            
            /* 박스를 열었을 때 뒤의 파스텔톤 배경이 아주 살짝 비치도록 투명도(0.65)와 흐림 배치 */
            --card-bg: rgba(255, 255, 255, 0.65); 
            --border-color: rgba(255, 255, 255, 0.6);
            --border-hover: rgba(255, 255, 255, 0.9);
            
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --namu-color: #0d9488;
            --namu-hover: #0f766e;
            --btn-bg: rgba(15, 23, 42, 0.06);
            --btn-text: #334155;
            
            /* 위키 본문용 */
            --wiki-text: #1e293b;
            --wiki-heading: #0f172a;
            --wiki-link: #2563eb;
            --wiki-link-hover: #1d4ed8;
            --wiki-infobox: rgba(255, 255, 255, 0.4);
            --wiki-infobox-header: rgba(15, 23, 42, 0.05);
            
            --glass-blur: blur(20px) saturate(160%);
            --glass-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            /* 🌌 다크 모드: 몽환적이고 차분한 오로라 파스텔 셋팅 */
            --bg-gradient: linear-gradient(135deg, #111827 0%, #1e1b4b 50%, #311042 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            
            /* 어두운 유리 베이스 (배경 비침 유지) */
            --card-bg: rgba(22, 28, 45, 0.7); 
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --namu-color: #00c4b2;
            --namu-hover: #00e0cb;
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-text: #e2e8f0;

            /* 위키 본문용 */
            --wiki-text: #e2e8f0;
            --wiki-heading: #ffffff;
            --wiki-link: #60a5fa;
            --wiki-link-hover: #93c5fd;
            --wiki-infobox: rgba(0, 0, 0, 0.25);
            --wiki-infobox-header: rgba(255, 255, 255, 0.06);
            
            --glass-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* 기본 스타일 */
        body {
            font-family: 'LINESeedKR-Rg', 'NanumSquareNeo-Variable', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed; /* 스크롤 시 파스텔 그라데이션 고정되어 유리에 무늬가 흐르는 효과 연출 */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s;
            min-height: 100vh;
        }
        
        /* 🧪 다크모드 토글 버튼 (리퀴드 글래스) */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: var(--text-main);
            box-shadow: var(--glass-shadow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header img {
            width: 140px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
        }
        .header h1 {
            font-family: 'LINESeedKR-Bd', sans-serif;
            margin: 0;
            font-size: 28px;
            color: var(--text-main);
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-block;
        }
        .header h1:hover {
            opacity: 0.7;
        }

        /* 🔍 검색 영역 (완전한 가독성을 위해 반투명을 살짝 낮춘 Solid 우위 유리) */
        .search-wrapper {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .search-container {
            display: flex;
            width: 100%;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
            border-radius: 30px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .search-container {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #searchInput {
            flex-grow: 1;
            padding: 18px 25px;
            font-size: 16px;
            font-family: 'LINESeedKR-Rg', sans-serif;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
        }
        #searchBtn {
            padding: 0 25px;
            font-size: 15px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
            background-color: var(--primary);
        }
        #searchBtn:hover {
            background-color: var(--primary-hover);
        }
        
        /* 💾 최근 검색어 태그 */
        .recent-searches {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .recent-tag {
            background-color: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .recent-tag:hover {
            border-color: var(--border-hover);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* 로딩 스피너 애니메이션 */
        .loading-container {
            display: none;
            text-align: center;
            margin: 40px 0;
        }
        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--text-sub); font-size: 16px; }

        /* 전체 레이아웃 */
        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1400px;
            gap: 30px;
        }

        /* 📋 왼쪽: 검색 결과 리스트 항목 (파스텔 비침 유리 적용) */
        #results {
            flex: 1;
            min-width: 320px;
            max-width: 380px;
        }
        .result-item {
            background-color: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 22px;
            border-radius: 18px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), 
                        box-shadow 0.25s ease, 
                        border-color 0.25s ease;
        }
        .result-item:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.1), inset 0 1px 2px rgba(255,255,255,0.7);
            border-color: var(--border-hover);
        }
        .result-title {
            margin: 0 0 12px 0;
            font-size: 19px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            color: var(--primary);
        }
        .result-snippet {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        
        /* 목록 내 버튼 그룹 */
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .view-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px;
            font-size: 14px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
        .view-btn:hover {
            background-color: var(--primary);
            color: white;
        }
        .namu-list-btn {
            background-color: var(--namu-color);
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .namu-list-btn:hover {
            background-color: var(--namu-hover);
        }

        /* 📖 오른쪽: 본문 읽기 뷰어 (열렸을 때 배경 파스텔이 아주 살짝 비치는 대형 유리박스) */
        #content-view {
            flex: 3;
            background-color: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 50px;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            display: none; 
            overflow-x: hidden;
            border: 1px solid var(--border-color);
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            gap: 15px;
        }
        .content-header h1 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 32px;
            margin: 0;
            color: var(--wiki-heading);
        }
        
        .namu-btn {
            background-color: var(--namu-color);
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-family: 'LINESeedKR-Bd', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2);
            transition: all 0.2s;
        }
        .namu-btn:hover {
            background-color: var(--namu-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(13, 148, 136, 0.3);
            color: white;
        }

        .wiki-body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 16px; line-height: 1.8; color: var(--wiki-text); font-weight: 400; }
        .wiki-body img { max-width: 100% !important; height: auto !important; border-radius: 8px; }
        .wiki-body a { text-decoration: none; color: var(--wiki-link); font-weight: 500; padding: 2px 4px; border-radius: 4px; transition: all 0.2s ease-in-out; border-bottom: 1.5px solid transparent; }
        .wiki-body a:hover { color: var(--wiki-link-hover); border-bottom: 1.5px solid var(--wiki-link-hover); background-color: rgba(37, 99, 235, 0.08); }
        
        /* 인포박스 내부 모듈 투명 가독성 정밀 보정 */
        .wiki-body .infobox { float: right; clear: right; margin: 0 0 20px 20px; background-color: var(--wiki-infobox); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; font-size: 14px; width: 320px; max-width: 100%; box-shadow: var(--glass-shadow); border-collapse: separate; border-spacing: 0; overflow: hidden; }
        .wiki-body .infobox th { background-color: var(--wiki-infobox-header); padding: 10px; border-bottom: 1px solid var(--border-color); color: var(--wiki-heading); }
        .wiki-body .infobox td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .wiki-body .thumb { float: right; clear: right; margin: 0 0 20px 20px; background-color: var(--wiki-infobox); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px; box-shadow: var(--glass-shadow); text-align: center; }
        .wiki-body .thumbinner { border: none !important; background: transparent !important; width: auto !important; }
        .wiki-body .thumbcaption { font-size: 13px; color: var(--text-sub); padding-top: 8px; text-align: left; }
        .wiki-body .toc { background: var(--wiki-infobox); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--border-color); padding: 25px; display: inline-block; margin: 20px 0; border-radius: 18px; box-shadow: var(--glass-shadow); }
        .wiki-body .toc h2 { margin-top: 0; border: none; font-size: 18px; font-weight: 700; }
        .wiki-body .toc ul { list-style-type: none; padding-left: 20px; }
        .wiki-body h2 { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 24px; color: var(--wiki-heading); border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-top: 2em; margin-bottom: 1em; scroll-margin-top: 20px; }
        .wiki-body h3 { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 20px; color: var(--wiki-heading); margin-top: 1.5em; scroll-margin-top: 20px; }
        .wiki-body .mw-editsection, .wiki-body .reference, .wiki-body .navbox, .wiki-body .metadata { display: none; }
        .wiki-body blockquote { background: var(--wiki-infobox); border-left: 5px solid var(--primary); margin: 1.5em 0; padding: 15px 20px; border-radius: 0 12px 12px 0; color: var(--text-sub); font-style: italic; }

        /* ✨ 우측 하단 고성능 아크릴 가치 내비게이션 바 */
        .scroll-nav {
            position: fixed;
            right: 25px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 8px;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--border-color);
            z-index: 99;
            transition: all 0.3s ease;
        }

        #scrollTopBtn, #scrollBottomBtn {
            display: none;
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 18px;
            font-weight: 800; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), 
                        background-color 0.2s ease, 
                        color 0.2s ease;
        }

        #scrollTopBtn:hover, #scrollBottomBtn:hover {
            background-color: var(--primary);
            color: white;
            transform: scale(1.12);
        }

        #scrollTopBtn:active, #scrollBottomBtn:active {
            transform: scale(0.95);
        }

        /* 모바일 반응형 웹 지원 */
        @media (max-width: 768px) {
            .search-container { flex-wrap: wrap; border-radius: 15px; }
            #searchInput { width: 100%; border-radius: 15px 15px 0 0; padding: 15px; }
            #searchBtn { flex: 1; padding: 15px 0; }
            #searchBtn { border-radius: 0 0 0 15px; }
            #namuSearchBtn { border-radius: 0 0 15px 0; border-left: none; border-top: 1px solid rgba(255,255,255,0.2); }
            
            .main-layout { flex-direction: column; }
            #results { max-width: 100%; min-width: auto; }
            #content-view { padding: 25px; }
            .content-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .namu-btn { width: 100%; justify-content: center; }
            .wiki-body .infobox, .wiki-body .thumb { float: none; width: 100%; margin: 0 0 20px 0; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">🌙 다크 모드</button>

    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/220px-Wikipedia-logo-v2.svg.png" alt="위키백과 로고">
        <h1 onclick="goHome()">위키백과 뷰어 Premier</h1>
    </div>

    <!-- 🔍 검색창 컴포넌트 -->
    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="궁금한 지식을 검색해 보세요..." onkeypress="handleKeyPress(event)">
            <button id="searchBtn" onclick="searchWikipedia()">검색</button>
        </div>
    </div>

    <div id="recent-searches" class="recent-searches"></div>

    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">지식을 탐색하는 중입니다...</div>
    </div>

    <div class="main-layout">
        <div id="results"></div>
        <div id="content-view"></div>
    </div>

    <div class="scroll-nav">
        <button id="scrollTopBtn" onclick="scrollToTop()" title="위로">↑</button>
        <button id="scrollBottomBtn" onclick="scrollToBottom()" title="아래로">↓</button>
    </div>

    <script>
        const articleCache = {}; 
        let recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || [];

        function goHome() {
            document.getElementById('content-view').style.display = 'none';
            history.pushState(null, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').textContent = '☀️ 라이트 모드';
            }
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggleBtn').textContent = newTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        }

        function updateRecentSearchesUI() {
            const container = document.getElementById('recent-searches');
            container.innerHTML = '';
            recentSearches.forEach(keyword => {
                const tag = document.createElement('div');
                tag.className = 'recent-tag';
                tag.textContent = keyword;
                tag.onclick = () => {
                    document.getElementById('searchInput').value = keyword;
                    searchWikipedia();
                };
                container.appendChild(tag);
            });
        }
        function addRecentSearch(query) {
            recentSearches = recentSearches.filter(item => item !== query);
            recentSearches.unshift(query);
            if (recentSearches.length > 5) recentSearches.pop();
            localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            updateRecentSearchesUI();
        }

        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display="flex"; document.getElementById("scrollBottomBtn").style.display="flex";
            } else {
                btn.style.display="none"; document.getElementById("scrollBottomBtn").style.display="none";
            }
        };
        function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}
        function scrollToBottom(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});}

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.title) {
                fetchArticleContent(event.state.title, false); 
            } else {
                document.getElementById('content-view').style.display = 'none';
            }
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWikipedia();
            }
        }

        async function searchWikipedia() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');

            if (!query) {
                alert('검색어를 입력해주세요!');
                return;
            }

            addRecentSearch(query);

            resultsContainer.innerHTML = '';
            contentView.style.display = 'none';
            loadingIndicator.style.display = 'block';

            const url = `https://ko.wikipedia.org/w/api.php?action=query&list=search&utf8=&format=json&origin=*&srlimit=8&srsearch=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                const searchResults = data.query.search;

                loadingIndicator.style.display = 'none';

                if (searchResults.length === 0) {
                    resultsContainer.innerHTML = '<div class="result-item"><p>검색 결과가 없습니다.</p></div>';
                    return;
                }

                searchResults.forEach(result => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    
                    const namuUrl = `https://namu.wiki/w/${encodeURIComponent(result.title)}`;
                    
                    resultItem.innerHTML = `
                        <h2 class="result-title">${result.title}</h2>
                        <div class="result-snippet">${result.snippet}...</div>
                        <div class="action-buttons">
                            <button class="view-btn" onclick="fetchArticleContent('${result.title.replace(/'/g, "\\'")}')">위키백과 읽기</button>
                            <a href="${namuUrl}" target="_blank" class="namu-list-btn">🌳 나무위키 보기</a>
                        </div>
                    `;
                    resultsContainer.appendChild(resultItem);
                });

            } catch (error) {
                loadingIndicator.style.display = 'none';
                console.error(error);
            }
        }

        async function fetchArticleContent(title, pushHistory = true) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');

            loadingIndicator.style.display = 'block';
            contentView.style.display = 'none';

            if (pushHistory) {
                try {
                    history.pushState({ title: title }, title, `?article=${encodeURIComponent(title)}`);
                } catch (error) {
                    console.warn("로컬 환경(file://)에서는 History API가 제한되지만, 본문은 정상적으로 로드됩니다.");
                }
            }

            if (articleCache[title]) {
                renderContent(title, articleCache[title]);
                return;
            }

            const url = `https://ko.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=text&format=json&origin=*`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    loadingIndicator.style.display = 'none';
                    alert('본문을 불러오는 데 실패했습니다.');
                    return;
                }

                const articleHtml = data.parse.text['*'];
                const parser = new DOMParser();
                const doc = parser.parseFromString(articleHtml, 'text/html');

                const images = doc.querySelectorAll('img');
                images.forEach(img => {
                    img.setAttribute('loading', 'lazy');
                    const src = img.getAttribute('src');
                    const srcset = img.getAttribute('srcset');
                    
                    if (src && src.startsWith('//')) {
                        img.setAttribute('src', 'https:' + src);
                    } else if (src && src.startsWith('/')) {
                        img.setAttribute('src', 'https://ko.wikipedia.org' + src);
                    }
                    
                    if (srcset) {
                        const newSrcset = srcset.split(',').map(item => {
                            let parts = item.trim().split(' ');
                            if (parts[0].startsWith('//')) {
                                parts[0] = 'https:' + parts[0];
                            } else if (parts[0].startsWith('/')) {
                                parts[0] = 'https://ko.wikipedia.org' + parts[0];
                            }
                            return parts.join(' ');
                        }).join(', ');
                        img.setAttribute('srcset', newSrcset);
                    }
                });

                const links = doc.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('/wiki/')) {
                        if (!href.startsWith('/wiki/파일:') && !href.startsWith('/wiki/File:')) {
                            const newTitle = decodeURIComponent(href.replace('/wiki/', ''));
                            link.setAttribute('href', 'javascript:void(0);');
                            link.setAttribute('onclick', `fetchArticleContent('${newTitle.replace(/'/g, "\\'")}')`);
                        } else {
                            link.setAttribute('href', 'https://ko.wikipedia.org' + href);
                            link.setAttribute('target', '_blank');
                        }
                    } else if (href && href.startsWith('#')) {
                        const anchorId = href.substring(1); 
                        link.setAttribute('href', 'javascript:void(0);');
                        link.setAttribute('data-anchor', anchorId);
                        link.setAttribute('onclick', `scrollToSection(this.getAttribute('data-anchor'))`);
                    }
                });

                const processedHtml = doc.body.innerHTML;
                articleCache[title] = processedHtml;

                renderContent(title, processedHtml);

            } catch (error) {
                loadingIndicator.style.display = 'none';
                alert('오류가 발생했습니다.');
                console.error(error);
            }
        }

        function renderContent(title, html) {
            const contentView = document.getElementById('content-view');
            const loadingIndicator = document.getElementById('loading');
            
            const namuUrl = `https://namu.wiki/w/${encodeURIComponent(title)}`;
            
            contentView.innerHTML = `
                <div class="content-header">
                    <h1>${title}</h1>
                    <a href="${namuUrl}" target="_blank" class="namu-btn">🌳 나무위키에서 찾기</a>
                </div>
                <div class="wiki-body">${html}</div>
            `;
            
            loadingIndicator.style.display = 'none';
            contentView.style.display = 'block';
            contentView.scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToSection(anchorId) {
            try {
                const decodedId = decodeURIComponent(anchorId);
                const targetElement = document.getElementById(decodedId) || document.getElementById(anchorId);
                
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            } catch (error) {
                console.error("목차 이동 중 오류가 발생했습니다:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateRecentSearchesUI();

            const urlParams = new URLSearchParams(window.location.search);
            const articleParam = urlParams.get('article');
            if (articleParam) {
                fetchArticleContent(articleParam, false);
            }
        });
    </script>
